openapi: 3.1.0
info:
  title: QLKH LMS API
  version: 1.4.1
  description: |
    Contract-first API cho QLKH LMS. Uỷ quyền áp dụng ở tầng dữ liệu (ADR-004):
    mọi truy vấn chạm PII được lọc theo SubjectContext (branch_id/quan hệ phụ
    huynh-học viên/lớp phụ trách) trước khi trả kết quả; truy cập ngoài phạm vi
    trả 404 (không lộ tồn tại), trừ trường hợp nêu rõ dùng 403.
    Rate limit: 120 req/phút/tài khoản và 600 req/phút/IP (429 kèm Retry-After).
    Lịch sử: 1.0.0 khởi tạo → 1.1.0 attendance/grade → 1.2.0 material →
    1.3.0 consents (QLKH-011) → 1.4.0 erasure-requests (QLKH-012, REQ-011):
    thêm response 422 cho `subject_student_id` thiếu/rỗng; làm rõ
    `due_at = requested_at + 30 ngày` do SERVER tính (client không gửi được);
    403 (không phải 404) khi người gọi không có quan hệ với học viên vì đây là
    hành động ghi có chủ đích, không phải truy vấn đọc theo phạm vi ẩn danh.
    Việc thực thi xóa (DB/log/lưu trữ lạnh) do job retention P4 đảm nhận bất
    đồng bộ ngoài vòng đời request; không có endpoint đồng bộ để xóa ngay.
    → 1.4.1 (QLKH-012, sửa lỗi contract-code lệch pha): createErasureRequest
    trả 202 (không phải 201) — khớp hiện thực `erasure_http.py` và
    `test_erasure_http.py` đã có sẵn: tài nguyên trả về mô tả một yêu cầu
    ĐANG chờ xử lý (status=pending), việc xóa thật do job P4 thực thi sau;
    bỏ header `Location` tương ứng (không phát ra trong response thật).
servers:
  - url: https://api.qlkh.example.vn/v1
paths:
  /health:
    get:
      operationId: health
      summary: Liveness/readiness probe
      responses:
        "200":
          description: OK
  /students:
    get:
      operationId: listStudents
      summary: Danh sách học viên trong phạm vi phiên (branch/quan hệ phụ huynh)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
        "429":
          description: Too Many Requests
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      operationId: createStudent
      summary: Tạo học viên (branch_id server gán từ phiên, bỏ qua giá trị client gửi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /students/{id}:
    get:
      operationId: getStudent
      summary: Chi tiết học viên; ngoài phạm vi trả 404 (không lộ tồn tại)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: patchStudent
      summary: Cập nhật học viên trong phạm vi branch của phiên
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentPatch" }
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /students/{id}/grades:
    get:
      operationId: listStudentGrades
      summary: Điểm của học viên (phụ huynh chỉ xem con mình)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /students/{id}/consents:
    get:
      operationId: listStudentConsents
      summary: Đồng ý xử lý dữ liệu của học viên, giới hạn theo chủ thể
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      operationId: createConsent
      summary: Ghi nhận đồng ý — chỉ cho học viên có quan hệ với người gọi
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentCreate" }
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Unprocessable Entity (ví dụ gộp nhiều mục đích trong một request)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /students/{id}/consents/{consent_id}:
    delete:
      operationId: revokeConsent
      summary: Rút đồng ý; ngoài phạm vi trả 404
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: consent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /classes/{class_id}/attendance:
    get:
      operationId: listAttendance
      summary: Điểm danh của lớp; giáo viên ngoài lớp phụ trách bị từ chối
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      operationId: bulkAttendance
      summary: Điểm danh hàng loạt (một lần gọi, tối đa 200 mục, NFR-004)
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceBulkCreate" }
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /classes/{class_id}/grades/{student_id}:
    put:
      operationId: upsertGrade
      summary: Ghi/sửa điểm; giáo viên ngoài lớp phụ trách bị từ chối
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string }
        - name: student_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeUpsert" }
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /classes/{class_id}/grade-history:
    get:
      operationId: listGradeHistory
      summary: Lịch sử sửa điểm; chỉ staff/teacher trong branch được xem
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /classes/{class_id}/materials:
    post:
      operationId: uploadMaterial
      summary: Tải học liệu lên bucket riêng tư; chỉ giáo viên phụ trách lớp
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/MaterialUpload" }
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /materials/{id}/download:
    get:
      operationId: downloadMaterial
      summary: Cấp URL ký (<=15 phút) sau khi kiểm quyền
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /erasure-requests:
    post:
      operationId: createErasureRequest
      summary: |
        Tạo yêu cầu xóa dữ liệu (ND13). Chỉ tạo được cho học viên có quan hệ
        với người gọi (phụ huynh của học viên, hoặc staff/admin trong branch).
        `due_at = requested_at + 30 ngày` do SERVER tính; client không gửi
        và không sửa được trường này. Việc xóa thật (DB, log, lưu trữ lạnh)
        do job retention P4 thực thi bất đồng bộ trước `due_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErasureRequestCreate" }
      responses:
        "202":
          description: |
            Accepted — yêu cầu xóa đã được ghi nhận (status=pending); việc
            xóa thật do job retention P4 thực thi bất đồng bộ trước `due_at`
            (QLKH-012 v1.4.1, sửa từ 201 ở v1.4.0: 202 đúng ngữ nghĩa hơn vì
            tài nguyên trả về mô tả một yêu cầu ĐANG chờ xử lý, không phải
            kết quả đã hoàn tất; khớp hiện thực `erasure_http.py` và bộ test
            `test_erasure_http.py::test_tao_thanh_cong_tra_202` đã có sẵn).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureRequest" }
        "403":
          description: |
            Forbidden — người gọi không có quan hệ với `subject_student_id`.
            Dùng 403 (không phải 404) vì đây là hành động ghi có chủ đích của
            người dùng đã xác thực, không phải truy vấn đọc cần ẩn tồn tại.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Unprocessable Entity — `subject_student_id` thiếu hoặc rỗng
            (QLKH-012, REQ-011).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too Many Requests
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
      required: [type, title, status]
    StudentCreate:
      type: object
      properties:
        full_name: { type: string, minLength: 1 }
        branch_id:
          type: string
          description: Bị bỏ qua nếu client gửi — server luôn lấy branch_id từ phiên.
      required: [full_name]
    StudentPatch:
      type: object
      properties:
        full_name: { type: string, minLength: 1 }
    ConsentCreate:
      type: object
      properties:
        purpose: { type: string, minLength: 1 }
        document_version: { type: string, minLength: 1 }
      required: [purpose, document_version]
    AttendanceBulkCreate:
      type: object
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              student_id: { type: string }
              status: { type: string, enum: [present, absent, late, excused] }
            required: [student_id, status]
      required: [entries]
    GradeUpsert:
      type: object
      properties:
        score: { type: number }
        reason: { type: string }
      required: [score]
    MaterialUpload:
      type: object
      properties:
        file: { type: string, format: binary }
        title: { type: string }
      required: [file, title]
    ErasureRequestCreate:
      type: object
      properties:
        subject_student_id:
          type: string
          minLength: 1
          description: Học viên cần xóa dữ liệu; bắt buộc, không được rỗng (422 nếu thiếu/rỗng).
      required: [subject_student_id]
    ErasureRequest:
      type: object
      properties:
        id: { type: string }
        subject_student_id: { type: string }
        requested_at: { type: string, format: date-time }
        due_at:
          type: string
          format: date-time
          description: requested_at + 30 ngày, do server tính.
        status: { type: string, enum: [pending, completed] }
      required: [id, subject_student_id, requested_at, due_at, status]
