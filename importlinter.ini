[importlinter]
root_package = qlkh

[importlinter:contract:layers]
name = Huong phu thuoc theo lop
type = layers
layers =
    qlkh.infrastructure
    qlkh.application
    qlkh.domain

[importlinter:contract:domain-pure]
name = Domain khong cham framework
type = forbidden
source_modules =
    qlkh.domain
forbidden_modules =
    sqlalchemy
    django
    fastapi
    flask
    starlette
    requests
    httpx
    psycopg
    redis
    boto3
