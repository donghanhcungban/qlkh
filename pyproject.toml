[project]
name = "qlkh"
version = "0.1.0"
requires-python = ">=3.11"
# QLKH-004 (REQ-001, NFR-001, ADR-002): băm mật khẩu argon2id. Ghim đúng phiên bản; hash nằm ở requirements.lock.
dependencies = ["argon2-cffi==25.1.0"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

# TCK-CR-RUNTIME-05 (CR-RUNTIME-NFR-001, risk_tags=[pii]): mutation testing thật
# cho luồng xoá dữ liệu chủ thể (ND13, /erasure-requests) và luồng ghi danh
# (enrollment). Không đổi hành vi nghiệp vụ của các module này — chỉ khai
# phạm vi mutmut. Dev-tool riêng cho job CI `mutation`, KHÔNG vào
# requirements.lock/dependencies (cùng quy ước với ruff/mypy/import-linter).
[tool.mutmut]
paths_to_mutate = "qlkh/application/erasure_http.py,qlkh/application/class_service.py,qlkh/application/class_http.py"
tests_dir = "tests/application"
runner = "python -m pytest tests/application/test_erasure_http.py tests/application/test_class_service.py tests/application/test_class_http.py -q"
